<!doctype html>
<html><head><meta charset="utf-8"><title>Barcode labels — {{ product.name }}</title>
<style>
@page { size: 50mm 30mm; margin: 1mm; }
* { box-sizing: border-box; }
body { font: 9pt Arial, sans-serif; margin: 0; color: #111; }
.label { width: 48mm; height: 28mm; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; page-break-after: always; }
.name { font-weight: 700; max-width: 47mm; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.code { font-size: 8pt; letter-spacing: .5px; }
.barcode svg { width: 44mm; height: 15mm; }
@media screen { body { background: #eee; padding: 12px; } .label { background: white; margin: 0 auto 12px; } }
</style></head><body>
{% for copy in copies %}<article class="label"><div class="name">{{ product.name }}</div><div class="barcode">{{ barcode_svg|safe }}</div><div class="code">{{ product.product_code }}{% if show_price %} &middot; {{ CURRENCY }} {{ product.discounted_price }}{% endif %}</div></article>{% endfor %}
<script>window.addEventListener('load', () => window.print());</script></body></html>
