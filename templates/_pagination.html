{% if page_obj.has_other_pages %}
<nav class="flex items-center justify-between mt-4" aria-label="Pages">
  {% if page_obj.has_previous %}<a class="btn btn-outline" href="{% querystring page=page_obj.previous_page_number %}">← Previous</a>{% else %}<span></span>{% endif %}
  <span class="help">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn btn-outline" href="{% querystring page=page_obj.next_page_number %}">Next →</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
