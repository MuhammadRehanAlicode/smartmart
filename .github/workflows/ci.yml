name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci, POSTGRES_DB: smartmart }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://postgres:ci@localhost:5432/smartmart
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npm run build:css && npm run build:js
      - name: Create migrations if the repo does not contain them yet
        run: python manage.py makemigrations --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py test --noinput
      - name: Production settings sanity check
        run: DJANGO_SETTINGS_MODULE=config.settings.prod DJANGO_ALLOWED_HOSTS=example.com DJANGO_SECRET_KEY=$(python -c "import secrets;print(secrets.token_urlsafe(64))") python manage.py check --deploy
